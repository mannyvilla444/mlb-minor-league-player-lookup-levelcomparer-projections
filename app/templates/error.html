{% extends "base.html" %}
{% block title %}Something went wrong — MLB Level Stats{% endblock %}

{% block content %}
<section class="panel panel-error">
  <h1 class="page-title">The MLB Stats API did not come through</h1>
  <p class="lede">
    This is upstream, not your search. The API timed out or returned an error.
  </p>
  <pre class="error-detail">{{ message }}</pre>
  <p>
    <a class="button" href="{{ retry_url }}" data-loading>Retry</a>
    <a class="button button-quiet" href="/">New search</a>
  </p>
</section>
{% endblock %}
